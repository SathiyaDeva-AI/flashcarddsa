<style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#fff;padding:18px;border-bottom:1px solid #ddd}.wrap{max-width:1000px;margin:auto;padding:14px}.filters,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:12px}.chips{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.chips button,.filters select,.filters input,button{padding:8px 11px;border:1px solid #ccd2dc;border-radius:8px;background:#fff}.chips button{white-space:nowrap}.chips .on{background:#172033;color:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{flex:1;min-width:180px}.card{min-height:500px}.meta{color:#667085;font-size:13px}h1{font-size:28px}.ex{background:#f7f8fa;padding:14px;border-radius:8px;line-height:1.8}.primary{background:#172033;color:#fff;border-color:#172033}pre{background:#111827;color:#fff;padding:14px;border-radius:8px;overflow:auto}.nav{display:flex;justify-content:space-between;align-items:center}.empty{text-align:center;padding:120px 10px;color:#667085}</style>
